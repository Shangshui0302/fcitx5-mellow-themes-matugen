name: Nix checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate the flake
        run: nix flake check --all-systems --no-build

      - name: Build all theme variants
        run: >-
          nix build --no-link
          .#both-blur
          .#light-blur
          .#dark-blur
          .#both-solid
          .#light-solid
          .#dark-solid

      - name: Check package output contracts
        run: nix build --no-link .#checks.x86_64-linux.variants
